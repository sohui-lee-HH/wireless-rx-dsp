[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-rx-dsp"
version = "0.1.0"
description = "A single-carrier and OFDM digital receiver built from scratch, plus an FMCW radar processing chain."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sohui" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    # Modulators are reused from Project 1. Uncomment once the repo URL is filled in,
    # then switch tx/symbols.py over to it:
    # "iqmodrec @ git+https://github.com/sohui-lee-HH/iqmodrec.git@v1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
